spring.application.name=mocktest
spring.datasource.url=jdbc:mysql://localhost:3306/cdac_mock_test?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Replace JWT_SECRET with a unique random value outside local development.
app.jwt.secret=${JWT_SECRET:local-dev-only-change-this-jwt-secret-key-32-bytes}
app.jwt.expiration-ms=3600000
name: Build & Release unfortunate-newt

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "mocktest/**"
      - ".github/workflows/ryvn-unfortunate-newt-release.yaml"
  pull_request:
    paths:
      - "mocktest/**"
      - ".github/workflows/ryvn-unfortunate-newt-release.yaml"

jobs:
  release:
    uses: ryvn-technologies/ryvn-build-action/.github/workflows/release.yml@v2
    with:
      service_name: unfortunate-newt
    permissions:
      contents: write
      id-token: write
